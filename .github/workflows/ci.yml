name: CI (suite-common)

on:
  push:
  pull_request:

jobs:
  # ── L1: adapter round-trips (fast, no display) ──────────────────────

  l1-suite-common:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Byte-compile suite_common
        run: python -m compileall suite_common
      - name: Run fileio_base unit tests
        run: python tests/test_fileio.py

  # The L2/L3 dogtail nightly that used to live here was removed: it drove
  # `just guitest` / `formulatest` / `e2etest` inside tuna-os/tables and
  # tuna-os/decks, both of which have since been folded into
  # tuna-os/gtk-office-suite as workspace members. That repo runs its own
  # GUI suite (`.github/workflows/gui-tests.yml`), so the coverage lives
  # there now. See the PR that removed this for the full reasoning.
